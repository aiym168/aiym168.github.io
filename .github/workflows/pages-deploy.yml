name: Deploy GitHub Pages

# Fallback when legacy branch builds stall. Deploys the already-built static tree on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add radio audio (release assets -> radio/audio, same-origin playback)
        run: |
          mkdir -p radio/audio
          python3 - <<'PY' || true
          import json, os, subprocess
          try:
              eps = json.load(open("data/radio/episodes.json")).get("episodes") or []
          except Exception:
              eps = []
          for e in eps[:30]:
              u = e.get("audio_url") or ""
              n = os.path.basename(u)
              if n.endswith(".mp3"):
                  subprocess.run(["curl", "-sSfL", "--retry", "3", "-o", f"radio/audio/{n}", u])
          print("radio audio files:", len(os.listdir("radio/audio")))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
