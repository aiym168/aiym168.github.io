name: Watchdog (self-heal)

# Every 30 min:
#  1. re-enable disabled workflows, re-dispatch the main update if it failed or
#     has not succeeded for > 90 min, record incidents in issue "[看门狗] 自动更新故障记录"
#  2. (optional) backup-server guard — only runs when its secrets exist; the site never depends on it
on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:
    inputs:
      force_wake:
        description: "强制唤醒备用服务器（可选）"
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      HAS_BOX_KEY: ${{ secrets.SIMULAR_BOX_KEY != '' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAGES_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Heal GitHub engine (A)
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN_ALT: ${{ secrets.GITHUB_TOKEN }}
        run: python3 engine/gh_watch.py heal --who "GitHub 看门狗" | tee /tmp/watch.json

      - name: Optional backup-server guard
        if: ${{ env.HAS_BOX_KEY == 'true' }}
        continue-on-error: true
        env:
          SIMULAR_BOX_KEY: ${{ secrets.SIMULAR_BOX_KEY }}
          SIMULAR_KEY_2: ${{ secrets.SIMULAR_KEY_2 }}
          FORCE_WAKE: ${{ inputs.force_wake && '1' || '0' }}
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN_ALT: ${{ secrets.GITHUB_TOKEN }}
        run: bash engine/simular/guard.sh

      - name: Record scheduled-run gaps
        if: success()
        run: python3 schedule_health.py mark --who github-watchdog && python3 schedule_health.py refresh

      - name: Commit schedule health
        if: success()
        run: |
          git config user.name "laohe-bot"
          git config user.email "9499758-wq@users.noreply.github.com"
          git add data/watchdog.json data/_internal_status.json
          if git diff --cached --quiet; then
            echo "schedule health unchanged"
            exit 0
          fi
          git commit -q -m "status check $(TZ=Asia/Shanghai date '+%F %H:%M')"
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && exit 0
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort || true; git reset -q --soft origin/main; git commit -q -m "status check (merged)" || true; }
            sleep $((i * 4))
          done
          echo "schedule health push failed"
          exit 1
