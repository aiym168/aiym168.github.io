name: Watchdog (self-heal)

# Every 30 min:
#  1. re-enable disabled workflows, re-dispatch the main update if it failed or
#     has not succeeded for > 90 min, record incidents in issue "[看门狗] 自动更新故障记录"
#  2. server guard: for each Simular server (engines B and C): if it is failed / asleep,
#     or its engine has no heartbeat for > 2h, wake it and re-assert its hourly wake schedule
on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:
    inputs:
      force_wake:
        description: "强制唤醒两台 Simular 服务器"
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAGES_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Heal GitHub engine (A)
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN_ALT: ${{ secrets.GITHUB_TOKEN }}
        run: python3 engine/gh_watch.py heal --who "GitHub 看门狗" | tee /tmp/watch.json

      - name: Server guard (both Simular servers)
        env:
          SIMULAR_BOX_KEY: ${{ secrets.SIMULAR_BOX_KEY }}
          SIMULAR_KEY_2: ${{ secrets.SIMULAR_KEY_2 }}
          FORCE_WAKE: ${{ inputs.force_wake && '1' || '0' }}
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN_ALT: ${{ secrets.GITHUB_TOKEN }}
        run: bash engine/simular/guard.sh
