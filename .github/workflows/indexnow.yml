name: IndexNow ping

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sitemap.txt"
      - "sitemap.xml"
      - "indexnow_push.py"
      - ".github/workflows/indexnow.yml"
      - "450689b4bf9c48644ca1ea6ac5547539.txt"
      - ".well-known/indexnow.txt"

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Submit IndexNow
        env:
          # Pages may still be deploying the new key file, and Bing can 403 once
          # more while it fetches that file. Wait and retry inside this job only.
          INDEXNOW_WAIT_SEC: "720"
        run: python3 indexnow_push.py
