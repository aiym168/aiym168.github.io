name: Auto update site

# Engine A (GitHub Actions). Engine B = Simular server (engine/engine_b.sh).
# Watchdog (.github/workflows/watchdog.yml) re-enables / re-dispatches this if it stops.
on:
  schedule:
    # Primary: hourly (UTC minute 7)
    - cron: "7 * * * *"
    # Backup: every 2 hours offset (UTC minute 37)
    - cron: "37 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build.py"
      - "deals_build.py"
      - "apiprice_build.py"
      - "data/sponsors.json"
      - "data/deals/curated.json"
      - "status.py"
      - "health_check.py"
      - "seo_config.json"
      - "fx.css"
      - "fx.js"
      - "vendor/**"
      - "cli/**"
      - "cli.sh"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAGES_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-healing pipeline (fetch → discover → translate → build → health/rollback → status)
        env:
          ENGINE: A
          ENGINE_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || github.event_name }}
          FETCH: ${{ github.event_name == 'push' && '0' || '1' }}
          STATUS_MARK: ${{ github.event_name == 'push' && '0' || '1' }}
          FORCE_X: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
          VERIFY_BAIDU: ${{ secrets.VERIFY_BAIDU }}
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: bash engine/pipeline.sh

      - name: Commit and push (GitHub Pages)
        env:
          DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -e
          git config user.name "laohe-bot"
          git config user.email "9499758-wq@users.noreply.github.com"
          if [ -n "$DEPLOY_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${DEPLOY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          rm -rf .last_good __pycache__
          git add -A
          git reset -q HEAD -- __pycache__ .last_good 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes — skip commit"
            exit 0
          fi
          git commit -q -m "auto update $(TZ=Asia/Shanghai date '+%F %H:%M') [engine A]"
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:main; then echo "pushed (try $i)"; exit 0; fi
            echo "push rejected — rebase on remote (engine B may have pushed)"
            git fetch -q origin main
            if ! git rebase -q -X ours origin/main; then
              git rebase --abort || true
              git reset -q --soft origin/main
              git commit -q -m "auto update $(TZ=Asia/Shanghai date '+%F %H:%M') [engine A, merged]" || true
            fi
            sleep $((i * 5))
          done
          echo "push failed after retries"; exit 1
